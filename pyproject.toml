[project]
name = "ni-seti"
version = "0.1.0"
description = "A CLI tool that allows you to easily setup your development machine on the go"
authors = [
    {name = "Latte X", email = "latteindigox@gmail.com"}
]
readme = "README.md"
dependencies = [
    "ansible",
    "click",
    "questionary"
]

[project.scripts]
niseti = "ni_seti.cli.main:main"

[build-system]
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"

[tool.flit.sdist]
include = ["ni_seti/shell_init.sh"]
